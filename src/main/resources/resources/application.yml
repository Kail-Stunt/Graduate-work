
spring:
  application:
    name: diplom

  datasource:
    url: jdbc:postgresql://localhost:5432/Graduate
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Password12

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  storage:
    path: ./uploads

server:
  port: 8080
